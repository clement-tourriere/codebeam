[package]
name = "astgrep-shim"
version = "0.1.0"
edition = "2021"
publish = false
description = "WASI shim exposing ast-grep-core structural matching to Codebeam via wazero"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
ast-grep-core = { version = "=0.44.0", features = ["tree-sitter"] }
ast-grep-language = { version = "=0.44.0", default-features = false, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-json",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
