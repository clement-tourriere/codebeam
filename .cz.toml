[tool.commitizen]
name = "cz_conventional_commits"
# The git tags are the single source of truth for the version; the binary gets
# it injected at build time via -ldflags, so no version file needs bumping.
version_provider = "scm"
tag_format = "v$version"
# Annotated tags carry a message, so signing (tag.gpgsign=true) works
# non-interactively instead of hanging on an editor prompt; they are also what
# `git push --follow-tags` pushes.
annotated_tag = true
update_changelog_on_bump = true
changelog_incremental = true
# Pre-1.0: breaking changes bump the minor version, not the major.
major_version_zero = true
